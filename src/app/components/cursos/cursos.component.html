<div class="w-full bg-white p-6 rounded-lg shadow-md space-y-8">
  <div class="w-full bg-white p-6 rounded-xl shadow-md space-y-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold text-gray-800">
          Módulo de Cursos
        </h1>
        <p class="text-sm text-gray-500">
          Registro, consulta y control académico de Cursos
        </p>
      </div>
      <button (click)="registrocursos()"
        class="inline-flex items-center gap-2 rounded-md bg-purple-700 px-4 py-2 text-sm font-medium text-white hover:bg-purple-800 transition"
        matTooltip="Registrar nuevo Cursos">
        + Registrar Cursos
      </button>
    </div>
    <div class="w-full bg-gray-100 rounded-lg p-4 shadow-md">
      <div class="flex flex-col gap-4 md:flex-row md:items-end">
        <!-- Buscador -->
        <div class="w-full md:w-1/3">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Buscar
          </label>
          <div class="flex flex-col sm:flex-row gap-2">
            <div class="relative flex-1">
              <mat-icon
                class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">search</mat-icon>
              <input type="text" placeholder="Buscar por cedula" class="w-full rounded-md border border-gray-300
               pl-10 pr-3 py-2 text-sm
               focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600
               transition" />
            </div>
          </div>
        </div>
        <!-- Profesor -->
        <div class="w-full md:w-1/4">
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Profesor
          </label>
          <select class="w-full rounded-md border border-gray-300 px-3 py-2 text-sm
               bg-white focus:outline-none focus:ring-2 focus:ring-purple-600 focus:border-purple-600"
            matTooltip="selecciona un profesor">
            <option value="">Todos los Docentes</option>
            <option  *ngFor="let teachers of listaprofesores" [value]="teachers.id" >
              {{teachers.cedula}} - {{teachers.nombre}}{{teachers.apellido}} - {{teachers.profesion}}
            </option>
          </select>
        </div>
        <!-- Botones -->
        <div class="flex gap-2 w-full md:w-auto">
          <button type="reset" class="w-full md:w-auto rounded-md bg-gray-300 px-4 py-2 text-sm
               font-medium text-gray-700 hover:bg-gray-400 transition" matTooltip="Limpiar filtros">
            Limpiar Filtros
          </button>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <mat-card *ngFor="let curso of cursos" class="shadow-lg">
        <mat-card-header>
          <mat-card-title>{{ curso.titulo }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p>{{ curso.descripcion }}</p>
        </mat-card-content>
        <mat-card-actions align="end">
          <button mat-button color="primary">
            Ver Curso
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
